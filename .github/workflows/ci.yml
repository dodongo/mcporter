name: Finite native product artifact and Intel comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  artifacts:
    if: github.repository == 'openclaw/mcporter' && github.ref_name == 'validation/emudhra-windows-20261023'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, xcode-27]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4307fdcc994c16f9a021e97cd5d6ea004275e051
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.34.6
          run_install: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Frozen source install and build
        working-directory: candidate
        run: |
          pnpm install --frozen-lockfile --engine-strict
          pnpm build
      - name: Exercise installed package, generated clients and native TLS
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            python harness/scripts/campaign-native-artifacts.py candidate "$RUNNER_TEMP/mcporter-native-proof"
          else
            python3 harness/scripts/campaign-native-artifacts.py candidate "$RUNNER_TEMP/mcporter-native-proof"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: mcporter-native-${{ runner.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/mcporter-native-proof/evidence
          if-no-files-found: error
          retention-days: 14
  proc-intel:
    if: github.repository == 'openclaw/mcporter' && github.ref_name == 'validation/emudhra-windows-20261023'
    runs-on: macos-26-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openclaw/proc-safe
          ref: 36eb601e55e5f00928412ac5877d5b57f4bd0fca
          path: base
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openclaw/proc-safe
          ref: c782265e6141a1efee6fca2b0c6feb4d7291422c
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
          package-manager-cache: false
      - name: Record old runtime
        run: echo "PAIR_OLD_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.4
          package-manager-cache: false
      - name: Record current runtime and resources
        run: |
          echo "PAIR_NEW_NODE=$(command -v node)" >> "$GITHUB_ENV"
          sysctl hw.logicalcpu hw.memsize
          df -h "$RUNNER_TEMP"
          uname -m
      - name: Compare full original suites and direct child entry point
        run: python3 harness/scripts/campaign-proc-pair.py base candidate "$RUNNER_TEMP/proc-intel-proof"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: proc-intel-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/proc-intel-proof/IDENTITIES.json
            ${{ runner.temp }}/proc-intel-proof/RESULTS.json
            ${{ runner.temp }}/proc-intel-proof/*.stdout
            ${{ runner.temp }}/proc-intel-proof/*.stderr
          if-no-files-found: error
          retention-days: 14
