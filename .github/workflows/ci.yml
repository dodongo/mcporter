name: Finite native Windows Bun metadata validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata:
    if: github.repository == 'openclaw/mcporter' && startsWith(github.ref_name, 'validation/emudhra-windows-')
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.22.1
      - name: Admit exact official Windows Bun and owning module
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'mcporter-bun-metadata'
          $proof = Join-Path $root 'evidence'
          New-Item -ItemType Directory -Path $proof | Out-Null
          $archive = Join-Path $root 'bun.zip'
          Invoke-WebRequest -Uri 'https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-windows-x64-baseline.zip' -OutFile $archive
          $archiveHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($archiveHash -ne '0f20ce6674d4f2dbcc8c5d59fdf99f7ba45f8c3b367e0f5781cbfa30a1c78d99') { throw 'Official Bun archive identity mismatch' }
          $moduleHash = (Get-FileHash 'scripts/campaign-runtime.ts' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($moduleHash -ne '98a9b7f0340875f10dfde34559a4a9e4248b8287dec18c77be8163dc49edd82f') { throw 'Reviewed owner module identity mismatch' }
          Expand-Archive -Path $archive -DestinationPath (Join-Path $root 'bun')
          $bun = Join-Path $root 'bun/bun-windows-x64-baseline/bun.exe'
          $inputs = [ordered]@{ sourceHead=(git rev-parse HEAD); node=(node --version); nodeSHA256=(Get-FileHash (node -p process.execPath) -Algorithm SHA256).Hash.ToLowerInvariant(); archiveSHA256=$archiveHash; bunSHA256=(Get-FileHash $bun -Algorithm SHA256).Hash.ToLowerInvariant(); ownerModuleSHA256=$moduleHash; runnerImage=$env:ImageVersion; runnerOS=$env:RUNNER_OS; runnerArch=$env:RUNNER_ARCH }
          $inputs | ConvertTo-Json -Depth 8 | Set-Content (Join-Path $proof 'INPUTS.json')
      - name: Exercise real metadata owner without project or global preloads
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $root = Join-Path $env:RUNNER_TEMP 'mcporter-bun-metadata'
          $proof = Join-Path $root 'evidence'
          $bun = Join-Path $root 'bun/bun-windows-x64-baseline/bun.exe'
          node scripts/campaign-bun-metadata-proof.mjs $proof $bun *> (Join-Path $proof 'owner-proof.log')
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows metadata proof failed; inspect retained diagnostics' }
          Get-Content (Join-Path $proof 'RESULTS.json')
      - name: Preserve bounded native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mcporter-windows-bun-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mcporter-bun-metadata/evidence
          if-no-files-found: error
          retention-days: 14
