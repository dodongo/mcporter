name: Finite Windows relay attribution
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'openclaw/mcporter' && startsWith(github.ref_name, 'validation/emudhra-windows-')
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      FIRECRAWL_API_KEY: test
      LINEAR_API_KEY: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: proof
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5f9eee19b4216359e5937032705f7ce274b2ef4d
          persist-credentials: false
          path: base
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f8562089b3f8ba862b46b7297dd09d72a4cd06f3
          persist-credentials: false
          path: candidate
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.22.1
      - name: Admit native runtime and prepare independent frozen inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'mcporter-proof'
          New-Item -ItemType Directory -Path $evidence | Out-Null
          node -e "if(process.version !== 'v24.22.1' || process.platform !== 'win32' || process.arch !== 'x64') process.exit(1)"
          if ($LASTEXITCODE -ne 0) { throw 'native Node admission failed' }
          $node = node -p process.execPath
          Get-FileHash $node -Algorithm SHA256 | Format-List | Out-File "$evidence/runtime.txt"
          node --version | Out-File -Append "$evidence/runtime.txt"
          corepack enable
          if ($LASTEXITCODE -ne 0) { throw 'Corepack setup failed' }
          foreach ($revision in @('base', 'candidate')) {
            Push-Location (Join-Path $env:GITHUB_WORKSPACE $revision)
            try {
              $env:COREPACK_HOME = Join-Path $env:RUNNER_TEMP "corepack-$revision"
              git rev-parse HEAD | Out-File "$evidence/$revision-head.txt"
              Get-FileHash package.json,pnpm-lock.yaml,tests/runtime-chrome-relay-handoff.test.ts,src/chrome-devtools-relay-handoff.ts -Algorithm SHA256 | Format-List | Out-File "$evidence/$revision-inputs.txt"
              pnpm --version | Out-File "$evidence/$revision-pnpm.txt"
              if ($LASTEXITCODE -ne 0) { throw 'selected package manager failed' }
              pnpm install --frozen-lockfile --engine-strict --store-dir "$env:RUNNER_TEMP/pnpm-$revision" *> "$evidence/$revision-install.log"
              if ($LASTEXITCODE -ne 0) { throw "frozen install failed for $revision" }
            } finally { Pop-Location }
          }
      - name: Run fixed A B B A comparison without changing test deadlines
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $evidence = Join-Path $env:RUNNER_TEMP 'mcporter-proof'
          $observer = Join-Path $env:GITHUB_WORKSPACE 'proof/scripts/trace-powershell.mjs'
          $observerUrl = node --input-type=module -e "import {pathToFileURL} from 'node:url'; console.log(pathToFileURL(process.argv[1]).href)" $observer
          Get-FileHash $observer -Algorithm SHA256 | Format-List | Out-File "$evidence/observer.txt"
          $rows = @()
          $index = 0
          foreach ($revision in @('base', 'candidate', 'candidate', 'base')) {
            $index++
            $label = "$index-$revision"
            $temp = Join-Path $env:RUNNER_TEMP "mcporter-temp-$label"
            New-Item -ItemType Directory -Path $temp | Out-Null
            Push-Location (Join-Path $env:GITHUB_WORKSPACE $revision)
            try {
              $env:COREPACK_HOME = Join-Path $env:RUNNER_TEMP "corepack-$revision"
              $env:TEMP = $temp
              $env:TMP = $temp
              $env:TMPDIR = $temp
              $env:MCPORTER_PROOF_DIAGNOSTICS = "$evidence/$label-powershell.jsonl"
              $env:NODE_OPTIONS = "--import=$observerUrl"
              $start = Get-Date
              pnpm test --maxWorkers=1 tests/runtime-chrome-relay-handoff.test.ts *> "$evidence/$label-test.log"
              $code = $LASTEXITCODE
              $rows += [pscustomobject]@{ label=$label; revision=$revision; exit=$code; started=$start.ToUniversalTime().ToString('o'); elapsedSeconds=((Get-Date)-$start).TotalSeconds }
              $rows | ConvertTo-Json | Set-Content "$evidence/results.json"
            } finally {
              Remove-Item Env:NODE_OPTIONS -ErrorAction SilentlyContinue
              Pop-Location
            }
          }
          if (@($rows | Where-Object { $_.exit -ne 0 }).Count -gt 0) { throw 'At least one unchanged-deadline comparison failed; inspect retained evidence.' }
      - name: Preserve finite comparison evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mcporter-windows-paired-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mcporter-proof
          if-no-files-found: error
          retention-days: 14
